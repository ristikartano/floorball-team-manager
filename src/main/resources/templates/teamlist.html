<!DOCTYPE html>
<html lang="fi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Joukkueet</title>

    <link rel="stylesheet" th:href="@{/style.css}">

</head>

<body>
    <h1>Joukkueet</h1>
    <p>Tervetuloa Floorball Team Manageriin!</p>

    <ul>
        <li th:each="team : ${teams}">
            <a th:href="@{/teams/view/{id}(id=${team.id})}" th:text="${team.name}"></a>

            <form sec:authorize="hasRole('ADMIN')" th:action="@{/teams/edit/{id}(id=${team.id})}" method="get"
                style="display: inline;">
                <button type="submit">Muokkaa</button>
            </form>

            <form sec:authorize="hasRole('ADMIN')" th:action="@{/teams/delete/{id}(id=${team.id})}" method="post"
                style="display: inline;">
                <button type="submit" class="delete-button">Poista</button>
            </form>

        </li>
    </ul>

    <form sec:authorize="hasRole('ADMIN')" th:action="@{/teams/new}" method="get">
        <button type="submit" >Lisää uusi joukkue</button>
    </form>

    <a href="/players" class="bottom-link" >Kaikki pelaajat</a>

</body>

</html>
