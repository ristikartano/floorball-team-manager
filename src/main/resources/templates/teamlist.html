<!DOCTYPE html>
<html lang="fi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Joukkueet</title>
</head>

<body>
    <h1>Joukkueet</h1>
    <p>Tervetuloa Floorball Team Manageriin!</p>

    <ul>
        <li th:each="team : ${teams}">
            <span th:text="${team.name}"></span>

            <a sec:authorize="hasRole('ADMIN')" th:href="@{/teams/edit/{id}(id=${team.id})}">Muokkaa joukkuetta</a>

            <form sec:authorize="hasRole('ADMIN')" th:action="@{/teams/delete/{id}(id=${team.id})}" method="post"
                style="display: inline;">
                <button type="submit">Poista joukkue</button>
            </form>


        </li>
    </ul>

    <a sec:authorize="hasRole('ADMIN')" th:href="@{/teams/new}">Lisää uusi joukkue</a>

</body>

</html>
