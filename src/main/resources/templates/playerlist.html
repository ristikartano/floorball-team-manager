<!DOCTYPE html>
<html lang="fi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Pelaajat</title>
</head>

<body>
    <h1>Pelaajat</h1>
    <p>Pelaajalistat</p>

    <ul>
        <li th:each="player : ${players}">
            <span th:text="${player.firstName} + ' ' + 
                ${player.lastName} + ' ' + '#' + ${player.jerseyNumber} + ' ' +  
                '(' + ${player.team.name} + ')'" ></span>

            <form sec:authorize="hasRole('ADMIN')" th:action="@{/players/edit/{id}(id=${player.id})}" method="get"
                style="display: inline;">

                <button type="submit">Muokkaa</button>

            </form>


            <form sec:authorize="hasRole('ADMIN')" th:action="@{/players/delete/{id}(id=${player.id})}" method="post"
                style="display: inline;">

                <button type="submit">Poista</button>

            </form>
        </li>
    </ul>

    <form sec:authorize="hasRole('ADMIN')" th:action="@{/players/new}" method="get">
        <button type="submit">Lisää uusi pelaaja</button>
    </form>

    <a href="/teams">Joukkueet</a>

   


</body>

</html>
