<!DOCTYPE html>
<html lang="fi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pelaajat</title>
</head>

<body>
    <h1>Pelaajat</h1>
    <p>Pelaajalistat</p>

    <ul>
        <li th:each="player : ${players}">
            <span th:text="${player.firstName} + ' ' + 
                ${player.lastName} + ' ' +  
                '(' + ${player.team.name} + ')'"></span>

            <a th:href="@{/players/edit/{id}(id=${player.id})}">Muokkaa pelaajaa</a>

            <form th:action="@{/players/delete/{id}(id=${player.id})}" 
                    method="post" 
                    style="display: inline;">

                <button type="submit">Poista pelaaja</button>


            </form>
        </li>
    </ul>

    <a href="/players/new">Lisää uusi pelaaja</a>


</body>

</html>
